# Short reusable answers. Gemini may pick these verbatim (counts as "bank" in hybrid mode).
answer_bank:
  why_company: >-
    I'm drawn to teams shipping real products to real users, and I want to grow as an engineer
    by owning meaningful work end to end. Your team's focus and engineering culture match the kind
    of environment where I do my best work.
  about_me: >-
    I'm a Computer Science student at Stony Brook University (GPA 3.74, graduating May 2028) who
    builds systems and AI products. I wrote a C++ key-value store sustaining 159K ops/sec across
    512 clients, built EcoCart's semantic search over 200K+ products with sub-100 ms latency, won
    1st place at HackSBU, and currently do transformer-based ML research at CRIZM.
  proudest_project: >-
    A high-performance key-value store in C++: I replaced per-connection threads with event-driven
    networking and a fixed worker pool, sharded the database across 64 independently locked shards,
    and added a write-ahead log, sustaining 159K median ops/sec across 512 concurrent clients
    without losing acknowledged writes during simulated crashes.
  salary_expectation: Open to the standard intern compensation for this role.

